<style>
*{box-sizing:border-box}

/* ---------- full-screen view ---------- */

.s10 .app-title{font-size:42px;font-weight:800}
.s10 .tab{font-size:25px;font-weight:800;border:3px solid #000;border-radius:14px;padding:12px 0;color:#000}
.s10 .tab.on{background:#000;color:#fff}
.s10 .tbl-h{font-size:30px;font-weight:800;background:#000;color:#fff;padding:6px 14px;border-radius:10px}
.s10 .shakes .row,.s10 .spices .row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"name name num" "half miss miss";border-bottom:2px solid #000;padding:12px 2px;column-gap:8px}
.s10 .c-name{grid-area:name;font-size:25px;font-weight:800;line-height:1.2}
.s10 .c-num{grid-area:num;gap:6px}
.s10 .c-half{grid-area:half}
.s10 .c-miss{grid-area:miss}
.s10 .c-half,.s10 .c-miss{font-size:22px;font-weight:700;text-align:right;margin-top:8px}
.s10 .c-miss{color:#c00000}
.s10 .lbl{display:inline}
.s10 .e{display:none}
.s10 .pm{width:52px;height:52px;border-radius:12px;border:3px solid #000;font-size:34px;font-weight:800;color:#000;background:#fff;font-family:Arial,sans-serif}
.s10 .pm.plus{background:#000;color:#fff}
.s10 .n{font-size:40px;font-weight:800;min-width:58px;line-height:1.2}
.s10 .low .n{background:#c00000;color:#fff;border-radius:10px}
.s10 .low .c-name{color:#c00000}
.s10 .hdr{font-size:20px;color:#000;border-bottom:3px solid #000;padding-top:8px;padding-bottom:8px}
.s10 .hdr .c-half,.s10 .hdr .c-miss{display:none}
.s10 .hdr .c-num{min-width:174px}
</style>
</head>
<body>

<div id="gallery" class="page">
  <h1>מאסטר שייק — באיזה סגנון תרצי את האפליקציה?</h1>
  <p class="sub">גללי, ותגידי לתומר את המספר שאת הכי אוהבת</p>
  <p class="hint">לחיצה על סגנון פותחת אותו בגודל מלא, כמו שהוא ייראה בטלפון.</p>
  <div id="cards"></div>
  <p class="outro">זהו, אלה כל ה־10. איזה מספר הכי אהבת? תגידי לתומר.</p>
</div>

<div id="full" hidden></div>

<script>
var STYLES = [
  ["לבן נקי + ירוק טרי", "נקי ומסודר, כמו אפליקציה של סופר טוב."],
  ["בר שייקים צבעוני", "כל שייק בצבע של הפרי שלו — צבעוני, אבל מסודר."],
  ["אייפון קלאסי", "נראה כמו ההגדרות באייפון — מוכר מהיום הראשון."],
  ["הלוח המחיק שלך", "בדיוק כמו הלוח במטבח, רק בטלפון. אין מה ללמוד."],
  ["שמיים ושמש", "תכלת וצהוב, שמח ובהיר — בלי להיות ילדותי."],
  ["פסטל חם", "צבעים רכים וחמים, כמו ספר מתכונים."],
  ["מחברת חשבונות", "דף עם שורות, כמו פנקס של העסק — רציני, אבל חם."],
  ["בוטני יוקרתי", "ירוק כהה וזהב, כמו בוטיק בריאות יוקרתי."],
  ["רמזור", "הצבע אומר הכל: ירוק — יש, כתום — מעט, אדום — נגמר."],
  ["ענק וברור", "מספרים ענקיים וכפתורים גדולים — קריא בלי משקפיים."]
];

// [name, ready, half, missing, color-key]
var SHAKES = [
  ["ניקוי ירוק",15,"","","g"],
  ["ויטמין C",8,"","","o"],
  ["Green Power",8,9,"","g"],
  ["Iron Man",5,"","","r"],
  ["פאטה מורינגה",4,6,"מורינגה","g"],
  ["ירוק עז",12,"","","g"],
  ["מוס שוקולד",10,"","","b"],
  ["שוקו-בננה",1,"","","b"],
  ["תות-בננה",5,"","","p"],
  ["מעדן דובדבן",6,"","","r"],
  ["מאקה",0,"","","t"],
  ["מאקה וואקה",10,"","","t"],
  ["אסאי",11,"","","v"],
  ["יער של פירות",0,10,"גוג'י","v"],
  ["קופנגן לבן",9,"","","c"],
  ["טרופיקיץ",20,"","","y"],
  ["מנגו קלאסי",3,"","","o"],
  ["השייק של יוני",11,"","","a"]
];
// [name, amount, in-process, color-key]
var SPICES = [
  ["שיבולת שועל",12,"","t"],
  ["מורינגה",25,"","g"],
  ["מוס שוקולד",6,"","b"],
  ["שוקו-בננה",30,"","b"],
  ["טרופיקיץ",9,18,"y"],
  ["מנגו",44,"","o"],
  ["מאקה",11,"","t"],
  ["מאקה וואקה",25,"","t"]
];

// state classes: low = 0 or 1 (emphasized in every style); t-g/t-o/t-r = traffic light (>=10 / 1-9 / 0)
function lvl(v){
  var c = v >= 10 ? "ok t-g" : (v >= 1 ? "t-o" : "t-r zero");
  if (v <= 1) c += " low";
  return c;
}
function numCell(v){
  return '<span class="c-num"><span class="pm plus" aria-label="הוספה">+</span><span class="n">' + v +
         '</span><span class="pm minus" aria-label="הפחתה">−</span></span>';
}
function sideCell(cls, label, val){
  var empty = (val === "" || val == null);
  return '<span class="' + cls + (empty ? ' e' : ' has') + '"><span class="lbl">' + label + ' </span>' + (empty ? '' : val) + '</span>';
}
function mockup(){
  var h = '<div class="app">' +
    '<div class="app-head"><div class="app-title">מלאי</div>' +
    '<div class="tabs"><span class="tab on">מלאי</span><span class="tab">הזמנות</span></div>' +
    '<div class="legend"><span><i class="dot-g"></i>יש מספיק (10 ומעלה)</span><span><i class="dot-o"></i>מעט (1 עד 9)</span><span><i class="dot-r"></i>נגמר (0)</span></div>' +
    '</div>';
  h += '<section class="tbl shakes"><h3 class="tbl-h">שייקים</h3><div class="tbl-body">' +
       '<div class="row hdr"><span class="c-name">שם</span><span class="c-num">מוכנים</span><span class="c-half">בחצי</span><span class="c-miss">מה חסר</span></div>';
  SHAKES.forEach(function(r){
    h += '<div class="row ' + lvl(r[1]) + ' k-' + r[4] + '"><span class="c-name">' + r[0] + '</span>' + numCell(r[1]) +
         sideCell("c-half", "בחצי:", r[2]) + sideCell("c-miss", "חסר:", r[3]) + '</div>';
  });
  h += '</div></section>';
  h += '<section class="tbl spices"><h3 class="tbl-h">תבלינים</h3><div class="tbl-body">' +
       '<div class="row hdr"><span class="c-name">שם</span><span class="c-num">כמות</span><span class="c-half">בתהליך</span></div>';
  SPICES.forEach(function(r){
    h += '<div class="row ' + lvl(r[1]) + ' k-' + r[3] + '"><span class="c-name">' + r[0] + '</span>' + numCell(r[1]) +
         sideCell("c-half", "בתהליך:", r[2]) + '</div>';
  });
  h += '</div></section></div>';
  return h;
}

var MOCK = mockup();
var cardsHtml = "";
STYLES.forEach(function(s, i){
  var n = i + 1;
  cardsHtml += '<a class="card" id="card-' + n + '" href="#style-' + n + '" data-n="' + n + '">' +
    '<div class="card-top"><span class="badge">' + n + '</span><div><div class="cname">' + s[0] + '</div><div class="cfeel">' + s[1] + '</div></div></div>' +
    '<div class="preview s' + n + '">' + MOCK + '</div>' +
    '<span class="card-btn">לראות את מספר ' + n + ' בגדול</span></a>';
});
document.getElementById("cards").innerHTML = cardsHtml;

var gallery = document.getElementById("gallery");
var full = document.getElementById("full");
var savedY = 0, cameFromGallery = false;

document.getElementById("cards").addEventListener("click", function(e){
  if (e.target.closest(".card")) { savedY = window.scrollY; cameFromGallery = true; }
});

function openStyle(n){
  var s = STYLES[n - 1];
  full.innerHTML =
    '<div class="bar"><button type="button" class="back">→ חזרה</button><div class="bar-title">סגנון ' + n + ' · ' + s[0] + '</div></div>' +
    '<div class="full-app s' + n + '">' + MOCK + '</div>' +
    '<div class="endbox">אהבת את זה? תגידי לתומר:<br><b>מספר ' + n + '</b><br><button type="button" class="back">→ חזרה לכל הסגנונות</button></div>';
  gallery.hidden = true;
  full.hidden = false;
  window.scrollTo(0, 0);
}
function closeStyle(){
  if (full.hidden) return;
  full.hidden = true;
  full.innerHTML = "";
  gallery.hidden = false;
  cameFromGallery = false;
  window.scrollTo(0, savedY);
}
function route(){
  var m = /^#style-(\d+)$/.exec(location.hash);
  var n = m ? +m[1] : 0;
  if (n >= 1 && n <= 10) openStyle(n); else closeStyle();
}
window.addEventListener("hashchange", route);

full.addEventListener("click", function(e){
  if (e.target.closest(".back")) {
    if (cameFromGallery) { history.back(); }
    else { history.replaceState(null, "", location.pathname + location.search); closeStyle(); }
    return;
  }
  // in the big view the + / − buttons really change the number, so she can feel it
  var b = e.target.closest(".pm");
  if (!b) return;
  var row = b.closest(".row"), n = row.querySelector(".n");
  var v = Math.max(0, (parseInt(n.textContent, 10) || 0) + (b.classList.contains("plus") ? 1 : -1));
  n.textContent = v;
  row.className = row.className.replace(/\b(ok|low|zero|t-[gor])\b/g, "").replace(/\s+/g, " ").trim() + " " + lvl(v);
});

route();
</script>
</body>
</html>
