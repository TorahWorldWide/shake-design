<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1c19">
<title>מאסטר שייק — 10 כיוונים שונים לגמרי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Assistant:wght@400;600;700;800&family=Caveat:wght@700&family=David+Libre:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Gveret+Levin&family=Heebo:wght@400;500;700;800&family=Karantina:wght@400;700&family=Miriam+Libre:wght@400;700&family=Noto+Color+Emoji&family=Noto+Sans+Hebrew:wght@400;600;700&family=Rubik:wght@400;500;700&family=Secular+One&family=Suez+One&family=Varela+Round&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#efe9e1;color:#1f1c19;font-family:Assistant,Heebo,Arial,"Liberation Sans",sans-serif;font-size:17px;line-height:1.45;overflow-x:hidden}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;line-height:1}

/* ================= gallery shell ================= */
.g-main{max-width:440px;margin:0 auto;padding:20px 10px 44px}
.g-main h1{font-size:28px;line-height:1.2;font-weight:800;margin:6px 4px 8px}
.g-lead{font-size:19px;line-height:1.4;margin:0 4px 14px;color:#4a433b}
.g-prev{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;margin:0 4px 24px;border-radius:999px;background:#fff;border:2px solid #1f1c19;color:#1f1c19;font-weight:700;font-size:18px;text-decoration:none}
.g-card{background:#fff;border-radius:22px;box-shadow:0 3px 16px rgba(40,30,20,.10);margin:0 0 28px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.g-ch{display:flex;gap:12px;align-items:center;padding:14px 14px 12px}
.g-badge{flex:none;width:52px;height:52px;border-radius:50%;background:#1f1c19;color:#fff;font:800 27px/52px Heebo,Arial,sans-serif;text-align:center}
.g-cn{font-size:23px;line-height:1.2;font-weight:700}
.g-cf{font-size:16px;line-height:1.4;color:#5b544c;margin-top:3px}
.g-pv{position:relative;height:660px;overflow:hidden;border-top:1px solid #e6e0d8;isolation:isolate}
.g-pv::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.92));pointer-events:none;z-index:5}
.g-pv .d{pointer-events:none;min-height:100%}
.g-open{display:flex;align-items:center;justify-content:center;min-height:54px;margin:12px 14px 16px;border-radius:14px;background:#1f1c19;color:#fff;font-size:19px;font-weight:700;text-decoration:none}
.g-outro{text-align:center;font-size:20px;font-weight:700;margin:8px 4px 0}
#full{min-height:100vh;background:#fff}
.f-bar{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;gap:12px;padding:0 10px;background:#1f1c19;color:#fff}
.f-back{flex:none;min-height:48px;min-width:96px;padding:0 18px;border:0;border-radius:12px;background:#fff;color:#1f1c19;font:800 20px Assistant,Heebo,Arial,sans-serif;cursor:pointer}
.f-title{font-size:18px;font-weight:700;line-height:1.2;min-width:0}
.f-body{max-width:480px;margin:0 auto}
.f-end{background:#1f1c19;color:#fff;text-align:center;padding:26px 16px 40px;font-size:19px;line-height:1.5}
.f-end b{display:block;font-size:30px}
.f-end .f-back{margin-top:16px}

/* ================= shared mockup base ================= */
.d{position:relative;text-align:right;font-size:17px;line-height:1.35;overflow-x:clip}
.d button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;line-height:1.15;min-width:44px}

/* ===== 1 · Excel sheet ===== */
.d1{font-family:"Noto Sans Hebrew",Arial,"Liberation Sans",sans-serif;background:#fff;color:#222;display:flex;flex-direction:column;height:660px}
.d1.full{height:calc(100vh - 64px);height:calc(100dvh - 64px)}
.x-top{flex:none;background:#217346;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;min-height:52px}
.x-file{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.x-ico{font-style:normal;width:26px;height:26px;border-radius:5px;background:#fff;color:#217346;font:700 17px/26px Arial,sans-serif;text-align:center}
.x-saved{font-size:16px;opacity:.9}
.x-fx{flex:none;display:flex;align-items:center;border-bottom:1px solid #c6c6c6;min-height:44px;font-size:16px}
.x-ref{flex:none;width:58px;text-align:center;border-left:1px solid #c6c6c6;color:#444;line-height:44px}
.x-f{flex:none;width:40px;text-align:center;color:#888;font-style:italic;border-left:1px solid #c6c6c6;line-height:44px;font-family:Georgia,serif}
.x-val{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-sheet{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.x-t{border-collapse:separate;border-spacing:0;table-layout:fixed;width:488px;font-size:16px}
.x-t th,.x-t td{height:45px;padding:0 6px;border-left:1px solid #d4d4d4;border-bottom:1px solid #d4d4d4;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;text-align:right}
.x-t thead th{position:sticky;top:0;z-index:2;background:#f2f2f2;font-weight:700;border-bottom:2px solid #a9a9a9;text-align:center}
.x-t thead th.x-nm{text-align:right}
.x-t .x-rn{position:sticky;right:0;z-index:1;background:#f2f2f2;color:#666;text-align:center;padding:0;border-right:1px solid #d4d4d4}
.x-t .x-nm{position:sticky;right:30px;z-index:1;font-weight:600;border-left:2px solid #a9a9a9}
.x-t thead .x-rn,.x-t thead .x-nm{z-index:3}
.x-t tbody tr:nth-child(even) td{background:#f4f7f5}
.x-t thead th.g{background:#c6efce;color:#006100}
.x-t thead th.y{background:#ffeb9c;color:#7a4500}
.x-t thead th.r{background:#ffc7ce;color:#9c0006}
.x-t td.x-c{text-align:center;font-variant-numeric:tabular-nums}
.x-t tbody td.y{background:#ffeb9c;color:#7a4500;font-weight:700}
.x-t tbody td.r{background:#ffc7ce;color:#9c0006;font-weight:700}
.x-t td.x-s{padding:0}
.x-t tbody td.ok{background:#c6efce;color:#006100}
.x-t tbody td.bad{background:#ffc7ce;color:#9c0006}
.x-t tbody td.x-nm.bad{background:#fff0f2;color:#9c0006;font-weight:700}
.x-t td.sel{box-shadow:inset 0 0 0 2px #217346}
.x-step{display:flex;align-items:center;height:44px}
.x-step span{flex:1;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.x-step button{flex:none;width:44px;height:44px;font-size:25px;font-family:Arial,"Liberation Sans",sans-serif;color:#217346;background:rgba(255,255,255,.55)}
.x-step button:first-child{border-left:1px solid rgba(0,0,0,.12)}
.x-step button:last-child{border-right:1px solid rgba(0,0,0,.12)}
.x-t tr.x-sect td{background:#d9e1f2!important;font-weight:700;color:#1f3864}
.x-t tr.x-hdr2 td{background:#f2f2f2!important;font-weight:700;text-align:center}
.x-t tr.x-hdr2 td.x-nm{text-align:right}
.x-t td.x-cnt{background:#e2efda!important;color:#1e4e1e;font-weight:700}
.x-tabs{flex:none;position:relative;z-index:6;display:flex;background:#f2f2f2;border-top:1px solid #c6c6c6}
.x-tabs button{flex:1 1 0;min-height:48px;font-size:16px;color:#444;border-left:1px solid #d4d4d4;padding:0 4px}
.x-tabs .on{background:#fff;color:#217346;font-weight:700;box-shadow:inset 0 -3px 0 #217346}

/* ===== 2 · Big-number tiles ===== */
.d2{font-family:Assistant,Heebo,Arial,"Liberation Sans",sans-serif;background:#edf1f6;color:#1c2a3a;padding:16px 12px 26px}
.t-head{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 12px}
.t-title{font:32px/1.1 "Secular One",Heebo,Arial,sans-serif}
.t-date{font-size:16px;color:#5d6b7c}
.t-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.d2 .t-tabs button{min-height:46px;border-radius:14px;background:#fff;font-weight:700;font-size:16px;color:#3a4a5c;box-shadow:0 1px 3px rgba(20,40,80,.1)}
.d2 .t-tabs .on{background:#1c2a3a;color:#fff}
.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d2 .t{background:#fff;border-radius:22px;box-shadow:0 5px 16px rgba(20,40,80,.09);padding:12px 12px 10px;display:flex;flex-direction:column;min-width:0}
.t-name{font-size:17px;font-weight:700;line-height:1.25}
.t-n{font:60px/1 "Secular One",Heebo,Arial,sans-serif;margin:6px 0 0;font-variant-numeric:tabular-nums}
.t-cap{font-size:16px;font-weight:700;color:#12925a;margin-top:2px}
.t-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.d2 .chip{font-size:16px;line-height:1.2;padding:3px 9px;border-radius:999px;font-weight:700}
.d2 .chip.y{background:#ffe27a;color:#5c4300}
.d2 .chip.r{background:#ffdad5;color:#a3150a}
.d2 .chip.h{background:#e6ebf2;color:#3a4a5c}
.d2 .chip.b{background:#dde9ff;color:#1d4fa8}
.t-pm{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.d2 .t-pm button{flex:1;height:44px;border-radius:14px;background:#edf1f6;font-size:26px;font-weight:700;color:#1c2a3a}
.d2 .t.low{background:#fff3f1;box-shadow:inset 0 0 0 2px #ff9a8c,0 5px 16px rgba(200,40,20,.12)}
.d2 .t.low .t-n,.d2 .t.low .t-cap{color:#dc2f1b}
.d2 .t.low .t-pm button{background:#ffe1dc}
.d2 .t-hero{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:#1c2a3a;color:#fff}
.t-hero .t-name{color:#c9d6e6;font-weight:600}
.t-hero .t-cap{color:#7fe3aa}
.t-hchips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.t-sub{font:24px/1.2 "Secular One",Heebo,Arial,sans-serif;margin:24px 4px 10px}
.d2 .tt{padding:10px 12px}
.d2 .tt .t-n{font-size:38px;margin-top:2px}

/* ===== 3 · iOS grouped list ===== */
.d3{font-family:Heebo,-apple-system,"SF Pro Text","Noto Sans Hebrew",Arial,sans-serif;background:#f2f2f7;color:#000;padding:6px 0 28px}
.i-nav{display:flex;justify-content:space-between;align-items:center;padding:0 8px;min-height:44px}
.d3 .i-nav button{min-height:44px;padding:0 8px;color:#007aff;font-size:17px}
.d3 .i-nav .i-plus{font-size:32px;font-weight:300}
.i-title{font-size:34px;font-weight:700;line-height:1.15;margin:0 16px 10px;letter-spacing:-.3px}
.i-seg{display:flex;margin:0 16px 12px;background:#e3e3e8;border-radius:10px;padding:2px}
.d3 .i-seg button{flex:1 1 0;min-height:44px;border-radius:8px;font-size:16px;font-weight:500}
.d3 .i-seg .on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:700}
.i-search{display:flex;align-items:center;gap:8px;margin:0 16px 20px;background:#e3e3e8;border-radius:10px;min-height:44px;padding:0 10px;color:#8a8a8e;font-size:17px}
.i-sh{display:flex;justify-content:space-between;margin:0 32px 6px;font-size:16px;color:#6d6d72}
.i-grp{background:#fff;border-radius:12px;margin:0 16px 24px;overflow:hidden}
.i-row{display:flex;align-items:center;gap:6px;min-height:60px;padding:6px 14px 6px 10px;position:relative}
.i-row+.i-row::before{content:"";position:absolute;top:0;right:14px;left:0;border-top:1px solid #e0e0e4}
.i-txt{flex:1;min-width:0;padding:4px 0}
.i-name{font-size:17px;line-height:1.25}
.i-sub{font-size:16px;color:#8a8a8e;line-height:1.3;margin-top:1px}
.i-sub .y::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffcc00;margin-left:5px;vertical-align:1px}
.i-sub .r{color:#ff3b30}
.i-sub span,.m-note span,.k-chip,.q-tag,.pill,.r-ing span,.s-st{white-space:nowrap}
.i-sub .b{color:#007aff}
.i-step{display:flex;align-items:center;flex:none}
.d3 .i-step button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#007aff;font-size:26px}
.i-badge{min-width:36px;height:28px;padding:0 8px;border-radius:14px;background:#e3f5e8;color:#1b7f3b;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.i-badge.gr{background:#e9e9ee;color:#3c3c43;margin-left:6px}
.i-row.low .i-badge{background:#ff3b30;color:#fff}
.i-row.low .i-name{font-weight:700}
.i-chev{flex:none;width:9px;height:9px;border-left:2.5px solid #c4c4c7;border-bottom:2.5px solid #c4c4c7;transform:rotate(45deg);margin-right:4px}
.i-foot{text-align:center;font-size:16px;color:#8a8a8e;margin:0 16px}

/* ===== 4 · Magazine ===== */
.d4{font-family:"Frank Ruhl Libre","David Libre",Georgia,"Times New Roman","Liberation Serif",serif;background:#f6efe2;color:#1d1813;padding:16px 18px 30px}
.m-mast{text-align:center;border-top:3px solid #1d1813;border-bottom:1px solid #1d1813;padding:8px 0 6px}
.m-brand{font-size:22px;font-weight:700;letter-spacing:1px}
.m-issue{font-size:16px;color:#6b5f50}
.m-nav{display:flex;justify-content:space-between;border-bottom:1px solid #1d1813;margin-bottom:20px}
.d4 .m-nav button{min-height:44px;font-size:17px;padding:0 2px;color:#5a4f42}
.d4 .m-nav .on{color:#1d1813;font-weight:700;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:2px}
.m-kick{font-size:16px;letter-spacing:.5px;color:#a3221a;font-weight:700}
.m-hl{font-size:84px;font-weight:900;line-height:.95;margin:0 0 8px;letter-spacing:-1px}
.m-deck{font-size:22px;line-height:1.35;margin:0 0 16px;font-weight:500}
.m-split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #1d1813;border-bottom:1px solid #1d1813;margin-bottom:26px}
.m-col{padding:10px 0 10px 12px;min-width:0}
.m-col+.m-col{border-right:1px solid #1d1813;padding:10px 12px 10px 0}
.m-col h4{font-size:16px;letter-spacing:1px;margin:0 0 6px;font-weight:700}
.m-col.r h4{color:#a3221a}
.m-col p{margin:0 0 6px;font-size:18px;line-height:1.25}
.m-col .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;margin-left:6px}
.m-col.r .big{color:#a3221a}
.d4 .hl{background:linear-gradient(transparent 40%,#ffe066 40%,#ffe066 92%,transparent 92%);padding:0 3px}
.m-sec{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #1d1813;padding-bottom:4px}
.m-sec h3{font-size:28px;font-weight:900;margin:0;line-height:1.1}
.m-sec span{font-size:16px;color:#6b5f50}
.m-row{display:flex;align-items:center;gap:6px;min-height:58px;border-bottom:1px solid rgba(29,24,19,.22);padding:6px 0}
.m-nm{flex:0 1 auto;min-width:0;max-width:58%}
.m-t{font-size:20px;line-height:1.2}
.m-note{font-size:16px;color:#6b5f50;line-height:1.3}
.m-note .r{color:#a3221a;font-weight:700}
.m-lead{flex:1 1 10px;min-width:10px;border-bottom:2px dotted rgba(29,24,19,.35);align-self:center;margin-top:12px}
.m-n{flex:none;min-width:40px;text-align:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums lining-nums;color:#2c5a39}
.m-row.low .m-n{color:#a3221a;font-weight:900}
.m-row.low .m-t{font-weight:700}
.m-pm{flex:none;display:flex;gap:4px}
.d4 .m-pm button{width:44px;height:44px;border:1px solid #1d1813;border-radius:50%;font-size:22px}
.m-box{border-top:4px double #1d1813;border-bottom:1px solid #1d1813;margin-top:28px;padding:10px 0 8px}
.m-box h3{font-size:24px;font-weight:900;margin:0 0 4px}
.m-tg{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.m-tr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-bottom:1px solid rgba(29,24,19,.18);padding:7px 0;font-size:17px;line-height:1.25;min-width:0}
.m-tr b{font-size:22px;font-variant-numeric:tabular-nums;color:#2c5a39}
.m-tr em{display:block;font-style:normal;font-size:16px;color:#6b5f50}
.m-end{text-align:center;margin-top:22px;font-size:16px;color:#6b5f50;letter-spacing:2px}

/* ===== 5 · Dark control room ===== */
.d5{font-family:Rubik,Heebo,Arial,"Liberation Sans",sans-serif;background:#0b1220;color:#e6edf7;padding:14px 12px 0}
.d5.full{min-height:calc(100vh - 64px)}
.k-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.k-title{font-size:28px;font-weight:700}
.k-live{font-size:16px;color:#3ef2b4;display:flex;align-items:center;gap:7px}
.k-live i{width:10px;height:10px;border-radius:50%;background:#3ef2b4;box-shadow:0 0 10px #3ef2b4}
.k-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.k-kpi{background:#121c2e;border:1px solid #1f2b44;border-radius:14px;padding:9px 10px;min-width:0}
.k-kpi span{display:block;font-size:16px;color:#8fa0bb;line-height:1.2}
.k-kpi b{font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.k-kpi.m b{color:#3ef2b4;text-shadow:0 0 12px rgba(62,242,180,.5)}
.k-kpi.a b{color:#ffb547;text-shadow:0 0 12px rgba(255,181,71,.4)}
.k-kpi.r{border-color:rgba(255,93,108,.6);box-shadow:0 0 18px rgba(255,93,108,.18)}
.k-kpi.r b{color:#ff5d6c;text-shadow:0 0 14px rgba(255,93,108,.8)}
.k-sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px;color:#8fa0bb;margin:4px 2px 8px}
.k-sec b{font-size:19px;color:#e6edf7;font-weight:500}
.k-row{display:flex;gap:10px;align-items:center;background:#121c2e;border:1px solid #1f2b44;border-radius:14px;padding:9px 10px 9px 8px;margin-bottom:8px}
.k-main{flex:1;min-width:0}
.k-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.k-name{font-size:17px;line-height:1.25}
.k-n{font-size:24px;font-weight:700;color:#3ef2b4;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-n small{font-size:16px;color:#5d6f8c;font-weight:400}
.k-bar{position:relative;height:10px;border-radius:5px;background:#1f2b44;margin:6px 0 2px}
.k-bar i{position:absolute;right:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(270deg,#25cf96,#3ef2b4);box-shadow:0 0 10px rgba(62,242,180,.45);width:calc(var(--v) * 5%)}
.k-bar u{position:absolute;top:-5px;bottom:-5px;width:4px;margin-right:-2px;border-radius:2px;background:#ffb547;box-shadow:0 0 8px #ffb547;right:calc(var(--w) * 5%)}
.k-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.k-chip{font-size:16px;line-height:1.3;padding:1px 8px;border-radius:6px;border:1px solid #2a3956;color:#9fb0c9}
.k-chip.a{color:#ffb547;border-color:rgba(255,181,71,.55);background:rgba(255,181,71,.08)}
.k-chip.r{color:#ff6b78;border-color:rgba(255,93,108,.6);background:rgba(255,93,108,.12)}
.k-pm{flex:none;display:flex;gap:6px}

  {n:"טרופיקיץ",v:20,c:"f",e:"🍍"},
  {n:"מנגו קלאסי",v:3,c:"f",e:"🥭"},
  {n:"השייק של יוני",v:11,c:"f",e:"🥤"}
];
// toppings ("תבלינים"): name · count · in process
const TP = [["שיבולת שועל",12,0],["מורינגה",25,0],["מוס שוקולד",6,0],["שוקו-בננה",30,0],["טרופיקיץ",9,18],["מנגו",44,0],["מאקה",11,0],["מאקה וואקה",25,0]];
const TABS = ["מלאי","הזמנות","היסטוריה","הגדרות"];
const CATS = [["g","ירוקים"],["f","פירות"],["c","שוקולד"],["m","מאקה"],["l","לימון"]];

// ---------- helpers ----------
const isLow = v => v <= 1;
const lowWord = v => v === 0 ? "אזל" : "נשאר 1";
const pm = (s, cls) => `<button type="button"${cls ? ` class="${cls}"` : ""} data-pm="${s}" aria-label="${s > 0 ? "הוספה" : "הפחתה"}">${s > 0 ? "+" : "−"}</button>`;
const tabs = () => TABS.map((t, i) => `<button type="button"${i ? "" : ' class="on" aria-current="page"'}>${t}</button>`).join("");
const emo = e => `<i class="emo" aria-hidden="true">${e}</i>`;
function totals(s){
  const t = {ready:0, wait:0, low:0, zero:0, one:0, orders:0, miss:0};
  s.forEach(x => { t.ready += x.v; t.wait += x.w || 0; if (x.w) t.orders++; if (x.m) t.miss++;
    if (isLow(x.v)) t.low++; if (x.v === 0) t.zero++; if (x.v === 1) t.one++; });
  return t;
}
function summary(s){
  const t = totals(s), p = [];
  if (t.zero) p.push(t.zero === 1 ? "שייק אחד אזל" : `${t.zero} שייקים אזלו`);
  if (t.one) p.push(t.zero ? (t.one === 1 ? "עוד אחד כמעט" : `עוד ${t.one} כמעט`) : (t.one === 1 ? "שייק אחד כמעט נגמר" : `${t.one} שייקים כמעט נגמרו`));
  if (!p.length) p.push("אין שייק שנגמר");
  return p.join(", ") + ` — ו־${t.orders} הזמנות פתוחות`;
}
function byCat(s, c){ return s.filter(x => x.c === c); }

// ---------- 1 · Excel ----------
function r1(s, o){
  let rn = 2, rows = "";
  s.forEach(x => {
    const lo = isLow(x.v);
    rows += `<tr data-i="${x.i}"><th class="x-rn">${rn++}</th><td class="x-nm${lo ? " bad" : ""}">${x.n}</td>` +
      `<td class="x-s ${lo ? "bad" : "ok"}${x.i === 0 ? " sel" : ""}"><div class="x-step">${pm(1)}<span>${x.v}</span>${pm(-1)}</div></td>` +
      `<td class="x-c${x.w ? " y" : ""}">${x.w || ""}</td><td class="x-c${x.m ? " r" : ""}">${x.m || ""}</td><td class="x-c">${x.h || ""}</td></tr>`;
  });
  rows += `<tr><th class="x-rn">${rn++}</th><td class="x-nm"></td><td></td><td></td><td></td><td></td></tr>`;
  rows += `<tr class="x-sect"><th class="x-rn">${rn++}</th><td class="x-nm">תבלינים</td><td></td><td></td><td></td><td></td></tr>`;
  rows += `<tr class="x-hdr2"><th class="x-rn">${rn++}</th><td class="x-nm">תבלין</td><td>כמות</td><td>בתהליך</td><td></td><td></td></tr>`;
  TP.forEach(t => { rows += `<tr><th class="x-rn">${rn++}</th><td class="x-nm">${t[0]}</td><td class="x-c x-cnt">${t[1]}</td><td class="x-c">${t[2] || ""}</td><td></td><td></td></tr>`; });
  return `<div class="d d1${o.full ? " full" : ""}">
<div class="x-top"><span class="x-file"><i class="x-ico" aria-hidden="true">X</i>מלאי שייקים</span><span class="x-saved">נשמר ✓</span></div>
<div class="x-fx"><span class="x-ref">C2</span><span class="x-f">fx</span><span class="x-val">${s[0].v}</span></div>
<div class="x-sheet" data-keep><table class="x-t"><colgroup><col style="width:30px"><col style="width:122px"><col style="width:120px"><col style="width:70px"><col style="width:90px"><col style="width:56px"></colgroup>
<thead><tr><th class="x-rn">1</th><th class="x-nm">שייק</th><th class="g">מוכנים</th><th class="y">מחכים</th><th class="r">חסר</th><th>בחצי</th></tr></thead>
<tbody>${rows}</tbody></table></div>

}

// ---------- 2 · Tiles ----------
function r2(s){
  const T = totals(s);
  const chips = x => (x.w ? `<span class="chip y">מחכים ${x.w}</span>` : "") + (x.h ? `<span class="chip h">בחצי ${x.h}</span>` : "") + (x.m ? `<span class="chip r">חסר: ${x.m}</span>` : "");

<div class="t-tabs">${tabs()}</div><div class="t-grid">
<div class="t t-hero"><div><div class="t-name">במקפיא עכשיו</div><div class="t-n">${T.ready}</div><div class="t-cap">שייקים מוכנים</div></div>
<div class="t-hchips"><span class="chip y">${T.wait} מחכים להזמנות</span><span class="chip r">${T.low} במלאי נמוך</span></div></div>`;
  s.forEach(x => {

}

  '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',

function r5(s, o){

    const lo = isLow(x.v), m = [];

// ---------- 6 · Kiosk ----------

// ---------- 8 · Pastel accordion ----------
const PAL = {g:["#dff4e6","#23885a"], f:["#ffe5dc","#d0573b"], c:["#f1e3d6","#8a5a3c"], m:["#ece4ff","#6e4fc4"], l:["#fff4c2","#9a7a00"], t:["#dcefff","#2f6fb8"]};
function r8(s, o){
  const open = o.open == null ? "f" : o.open;
  const sec = (key, title, pills, body) => {
    const on = open === key;
    return `<div class="a-sec${on ? " open" : ""}" style="--bg:${PAL[key][0]};--ac:${PAL[key][1]}"><button type="button" class="a-hd" data-acc="${key}" aria-expanded="${on}">` +
      `<span class="a-t">${title}</span><span class="a-pills">${pills}</span><span class="a-chev" aria-hidden="true"></span></button>${on ? `<div class="a-body">${body}</div>` : ""}</div>`;
  };
  let h = `<div class="d d8"><div class="a-hi">בוקר טוב</div><div class="a-title">מלאי</div><div class="a-tabs">${tabs()}</div>`;
  CATS.forEach(([k, title]) => {
    const items = byCat(s, k), T = totals(items);
    let pills = `<span class="pill g">${T.ready} מוכנים</span>`;
    if (T.zero) pills += `<span class="pill r">${T.zero} אזל</span>`;
    if (T.one) pills += `<span class="pill r">${T.one} כמעט נגמר</span>`;
    if (T.wait) pills += `<span class="pill y">מחכים ${T.wait}</span>`;
    if (T.miss) pills += `<span class="pill r">חסר מרכיב</span>`;
    const body = items.map(x => {
      const lo = isLow(x.v), c = [];
      if (lo) c.push(`<span class="pill r">${lowWord(x.v)}</span>`);
      if (x.w) c.push(`<span class="pill y">מחכים ${x.w}</span>`);
      if (x.h) c.push(`<span class="pill">בחצי ${x.h}</span>`);
      if (x.m) c.push(`<span class="pill r">חסר: ${x.m}</span>`);
      return `<div class="a-row${lo ? " low" : ""}" data-i="${x.i}"><div class="nm">${x.n}${c.length ? `<div class="chips">${c.join("")}</div>` : ""}</div><div class="a-step">${pm(1)}<b>${x.v}</b>${pm(-1)}</div></div>`;
    }).join("");
    h += sec(k, title, pills, body);
  });
  const tbody = TP.map(t => `<div class="a-row"><div class="nm">${t[0]}${t[2] ? `<div class="chips"><span class="pill">בתהליך ${t[2]}</span></div>` : ""}</div><div class="a-step" style="padding:0 14px;min-height:44px"><b>${t[1]}</b></div></div>`).join("");
  h += sec("t", "תבלינים", `<span class="pill">${TP.length} סוגים</span><span class="pill">בתהליך 18</span>`, tbody);
  return h + `</div>`;
}

const ORD = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳"];
function r9(s){

  let h = `<div class="d d9"><div class="r-tabs">${tb}</div><div class="r-cover"><small>מאסטר שייק</small><h2>ספר המלאי</h2><p>${summary(s)}</p>${DIVIDER}</div>`;
  CATS.forEach(([k, title], ci) => {
    h += `<div class="r-chap"><h3>פרק ${ORD[ci]} · ${title}</h3></div>`;
    byCat(s, k).forEach(x => {
      const lo = isLow(x.v), g = [];
      if (lo) g.push(`<span class="r">${x.v ? "נשאר אחד — להכין!" : "אזל — להכין!"}</span>`);
      if (x.w) g.push(`<span class="y">מחכים להזמנות: ${x.w}</span>`);
      if (x.h) g.push(`<span class="h">בחצי: ${x.h}</span>`);
      if (x.m) g.push(`<span class="r">חסר: ${x.m}</span>`);
      if (!g.length) g.push(`<span class="ok">מוכן במקפיא</span>`);
      h += `<div class="r-card${lo ? " low" : ""}" data-i="${x.i}"><div class="r-emo">${emo(x.e)}</div><div class="r-txt"><div class="r-name">${x.n}</div><div class="r-ing">${g.join("")}</div></div>` +
        `<div class="r-side"><div class="r-stamp">${x.v}<small>${lo ? lowWord(x.v) === "אזל" ? "אזל" : "אחרון" : "מוכנים"}</small></div><div class="r-pm">${pm(1)}${pm(-1)}</div></div></div>`;
    });
  });
  h += `<div class="r-chap"><h3>המזווה · תבלינים</h3></div><div class="r-jars">` +
    TP.map(t => `<div class="r-jar"><div class="r-lid"></div><div class="r-body"><div class="r-lbl">${t[0]}<b>${t[1]}</b></div>${t[2] ? `<div class="r-proc">בתהליך ${t[2]}</div>` : ""}</div></div>`).join("") +
    `</div>${DIVIDER}</div>`;
  return h;
}

// ---------- 10 · Swiss ----------
function r10(s){
  const T = totals(s);
  const cells = s.map(x => {
    const lo = isLow(x.v), st = [];
    if (lo) st.push(`<div class="s-st r">${lowWord(x.v)}</div>`);
    if (x.w) st.push(`<div class="s-st"><i class="s-sq y"></i>מחכים ${x.w}</div>`);
    if (x.h) st.push(`<div class="s-st"><i class="s-sq k"></i>בחצי ${x.h}</div>`);
    if (x.m) st.push(`<div class="s-st r"><i class="s-sq r"></i>חסר ${x.m}</div>`);
    return `<div class="s-cell${lo ? " low" : ""}" data-i="${x.i}"><div class="s-idx"><span>${String(x.i + 1).padStart(2, "0")}</span><i class="s-sq${lo ? " r" : ""}"></i></div>` +
      `<div class="s-n s-disp">${x.v}</div><div class="s-nm">${x.n}</div>${st.join("")}<div class="s-pm">${pm(1)}${pm(-1)}</div></div>`;
  }).join("");
  const tc = TP.map(t => `<div class="s-tc"><b class="s-disp">${t[1]}</b><span>${t[0]}</span>${t[2] ? `<em>בתהליך ${t[2]}</em>` : ""}</div>`).join("");
  return `<div class="d d10"><div class="s-meta"><span>מאסטר שייק</span><span>מקפיא / מלאי</span></div>
<div class="s-title s-disp">מלאי</div><div class="s-tabs">${tabs()}</div>
<div class="s-legend"><span><i class="s-sq"></i>מוכן</span><span><i class="s-sq y"></i>מחכים להזמנה</span><span><i class="s-sq r"></i>חסר / אזל</span></div>
<div class="s-sum"><div><b class="s-disp">${T.ready}</b><span>מוכנים</span></div><div><b class="s-disp">${T.wait}</b><span>מחכים</span></div><div class="lo"><b class="s-disp">${T.low}</b><span>מלאי נמוך</span></div></div>
<div class="s-label"><h3>שייקים</h3><span>${s.length}</span></div><div class="s-grid">${cells}</div>
<div class="s-label" style="margin-top:22px"><h3>תבלינים</h3><span>${TP.length}</span></div><div class="s-tgrid">${tc}</div>
<div class="s-foot"><span>מאסטר שייק</span><span>${s.length} שייקים · ${TP.length} תבלינים</span></div></div>`;
}

// ---------- the ten directions ----------
const DIRS = [
  {name:"טבלה כמו אקסל", feel:"בדיוק כמו הגיליון שאת כבר מכירה — שורות, עמודות וכל המספרים במבט אחד.", font:'"Noto Sans Hebrew",Arial,sans-serif', fs:23, r:r1},
  {name:"אריחים עם מספר ענק", feel:"כל שייק באריח משלו והמספר ענק — רואים מה יש עוד לפני שקוראים.", font:'"Secular One",Heebo,Arial,sans-serif', fs:24, r:r2},
  {name:"רשימת אייפון", feel:"נראה כמו ההגדרות בטלפון — רשימה נקייה, מסודרת ומוכרת מהיום הראשון.", font:'Heebo,Arial,sans-serif', fs:23, r:r3},
  {name:"מגזין", feel:"כמו עיתון בוקר: כותרת אחת שאומרת מה חשוב היום, ומתחתיה כל המלאי.", font:'"Frank Ruhl Libre",Georgia,serif', fs:26, r:r4},
  {name:"דאשבורד כהה", feel:"חדר בקרה: רקע כהה, פסים זוהרים, ומה שנגמר — זוהר באדום.", font:'Rubik,Arial,sans-serif', fs:23, r:r5},
  {name:"קיוסק", feel:"כפתורים ענקיים וניגוד חזק — לוחצים גם עם כפפות בחדר הקירור.", font:'Alef,Arial,sans-serif', fs:25, r:r6},
  {name:"פתקים על לוח שעם", feel:"כל שייק פתק צבעוני בכתב יד, נעוץ בנעץ על לוח — חם ואנושי.", font:'"Gveret Levin",cursive,sans-serif', fs:27, r:r7},
  {name:"אקורדיון בפסטל", feel:"השייקים מקובצים לפי סוג בצבעים רכים — פותחים רק את מה שצריך עכשיו.", font:'"Varela Round",Arial,sans-serif', fs:23, r:r8},
  {name:"ספר מתכונים", feel:"נייר חם, פרי ליד כל שייק והמספר בתוך חותמת — ביתי ונעים.", font:'"Suez One",Georgia,serif', fs:24, r:r9},
  {name:"טיפוגרפי שוויצרי", feel:"שחור על לבן, רשת מדויקת, והמספר הוא העיצוב — חזק ושקט.", font:'Karantina,"Arial Narrow",Arial,sans-serif', fs:32, r:r10}
];

// ---------- rendering + routing ----------
const $ = id => document.getElementById(id);
const items = vals => SH.map((x, i) => Object.assign({}, x, {v: vals[i], i}));
const BASE = SH.map(x => x.v);
let cur = 0, V = null, OPEN = "f", lastY = 0, fromGallery = false;

$("cards").innerHTML = DIRS.map((d, k) => `<article class="g-card" id="card-${k + 1}" data-n="${k + 1}">
<div class="g-ch"><div class="g-badge">${k + 1}</div><div><div class="g-cn" style="font-family:${d.font.replace(/"/g, "'")};font-size:${d.fs}px">${d.name}</div><div class="g-cf">${d.feel}</div></div></div>
<div class="g-pv" inert aria-hidden="true">${d.r(items(BASE), {full:false})}</div>
<a class="g-open" href="#style-${k + 1}">לראות במסך מלא ←</a></article>`).join("");

function draw(){
  const body = $("fbody");
  const keep = [...body.querySelectorAll("[data-keep]")].map(e => [e.scrollTop, e.scrollLeft]);
  body.innerHTML = DIRS[cur - 1].r(items(V), {full:true, open:OPEN});
  body.querySelectorAll("[data-keep]").forEach((e, j) => { if (keep[j]) { e.scrollTop = keep[j][0]; e.scrollLeft = keep[j][1]; } });
}
function route(){
  const m = /^#style-(\d+)$/.exec(location.hash), n = m ? +m[1] : 0;
  if (n >= 1 && n <= DIRS.length){
    if (!$("full").hidden && cur === n) return;
    if ($("full").hidden) lastY = window.scrollY;
    cur = n; V = BASE.slice(); OPEN = "f";
    const d = DIRS[n - 1];
    $("ftitle").textContent = `${n} · ${d.name}`;
    $("fend").innerHTML = `<b>${n}</b>${d.name}<br>אהבת? תגידי לתומר: מספר ${n}.<br><button type="button" class="f-back" data-back>חזרה לכל הכיוונים</button>`;
    draw();
    $("gallery").hidden = true; $("full").hidden = false;
    document.title = `${n} · ${d.name} — מאסטר שייק`;
    window.scrollTo(0, 0);
  } else if (!$("full").hidden || cur){
    const was = cur; cur = 0;
    $("full").hidden = true; $("gallery").hidden = false; $("fbody").innerHTML = "";
    document.title = "מאסטר שייק — 10 כיוונים שונים לגמרי";
    if (fromGallery) window.scrollTo(0, lastY);
    else if (was) { const c = $("card-" + was); if (c) c.scrollIntoView({block:"start"}); }
    fromGallery = false;
  }
}
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("hashchange", route);
$("cards").addEventListener("click", e => {
  const card = e.target.closest(".g-card"); if (!card) return;
  e.preventDefault(); fromGallery = true; location.hash = "style-" + card.dataset.n;
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")){
    if (fromGallery) history.back();
    else { history.replaceState(null, "", location.pathname + location.search); route(); }
    return;
  }
  if ($("full").hidden) return;
  const b = e.target.closest("[data-pm]");
  if (b){ const it = b.closest("[data-i]"); if (!it) return; const i = +it.dataset.i; V[i] = Math.max(0, V[i] + (+b.dataset.pm)); draw(); return; }
  const a = e.target.closest("[data-acc]");
  if (a){ OPEN = OPEN === a.dataset.acc ? "" : a.dataset.acc; draw(); }
});
route();
</script>
</body>
